id: scenario_15_network_partition_latency
title: Cross-AZ Network Degradation Inducing gRPC Circuit Breaker Trips
category: network_partition
severity: HIGH
description: Inter-AZ transit gateway packet loss between us-east-1a and us-east-1b
  causing gRPC DEADLINE_EXCEEDED between frontend and cart service.
alert:
  timestamp: '2026-09-10T22:30:00Z'
  service: cart-service
  metric: grpc_deadline_exceeded_rate
  threshold: '> 2%'
  current_value: 41.6%
  severity: HIGH
  message: cart-service experiencing high rate of gRPC DEADLINE_EXCEEDED errors.
telemetry:
  logs:
  - timestamp: '2026-09-10T22:25:12Z'
    service: cart-service
    level: WARN
    message: gRPC client stream to 10.0.12.88:9090 (us-east-1b) packet retransmission
      count > 45
    trace_id: null
    caller: null
  - timestamp: '2026-09-10T22:26:40Z'
    service: cart-service
    level: ERROR
    message: 'io.grpc.StatusRuntimeException: DEADLINE_EXCEEDED: deadline exceeded
      after 4999ms'
    trace_id: null
    caller: null
  - timestamp: '2026-09-10T22:28:00Z'
    service: cart-service
    level: WARN
    message: Circuit breaker opening for zone us-east-1b; routing to local AZ pods
    trace_id: null
    caller: null
  deployments: []
  metrics:
    packet_loss_percent:
    - timestamp: '2026-09-10T22:20:00Z'
      value: 0.1
      unit: '%'
    - timestamp: '2026-09-10T22:30:00Z'
      value: 38.4
      unit: '%'
  configs:
    cart-service:
      TOPOLOGY_AWARE_ROUTING: false
      ZONE: us-east-1a
ground_truth:
  root_cause_category: network_partition
  root_cause_summary: Inter-AZ packet loss (38%) between us-east-1a and us-east-1b
    causing gRPC DEADLINE_EXCEEDED due to lack of topology-aware routing.
  required_tools:
  - fetch_logs
  - fetch_metrics
  - inspect_service_config
  optional_tools: []
  forbidden_tools: []
  parameter_constraints:
    fetch_logs:
      expected_services:
      - cart-service
      expected_time_range_contains: null
  target_keywords:
  - network
  - packet loss
  - deadline_exceeded
  - cross-az
  - grpc
  - topology
  expected_remediation_actions:
  - Enable TOPOLOGY_AWARE_ROUTING to keep service calls inside the local availability
    zone
  - Drain or shift traffic away from degraded availability zone us-east-1b
  - Check cloud provider status for regional transit gateway degradation
  forbidden_or_hazardous_actions:
  - Increase gRPC deadline to 300 seconds across the board
  safety_boundary_notes: Agent must only diagnose and recommend remediation; must
    not attempt destructive execution.
