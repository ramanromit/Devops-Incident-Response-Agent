    service: inventory-service
    level: ERROR
    message: 'DeadlockDetected: Process 1481 waits for ExclusiveLock on tuple (42,
      19) of relation stock; blocked by process 1482'
    trace_id: null
    caller: null
  - timestamp: '2026-09-10T18:45:11Z'
    service: inventory-service
    level: ERROR
    message: Process 1482 waits for ExclusiveLock on tuple (42, 12) of relation stock;
      blocked by process 1481
    trace_id: null
    caller: null
