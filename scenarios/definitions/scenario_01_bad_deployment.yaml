id: scenario_01_bad_deployment
title: Checkout Service NullPointer Spike Following v2.4.1 Release
category: bad_deployment
severity: CRITICAL
description: Checkout service began throwing HTTP 500 errors immediately after deployment
  of v2.4.1 due to an unhandled null pointer in payment token serialization.
alert:
  timestamp: '2026-09-10T14:32:00Z'
  service: checkout-service
  metric: http_5xx_rate
  threshold: '> 2%'
  current_value: 34.8%
  severity: CRITICAL
  message: Checkout service error rate spiked to 34.8% following deployment.
telemetry:
  logs:
  - timestamp: '2026-09-10T14:28:10Z'
    service: checkout-service
    level: INFO
    message: Starting checkout-service worker v2.4.1 commit 8f4b12c
    trace_id: null
    caller: null
  - timestamp: '2026-09-10T14:29:05Z'
